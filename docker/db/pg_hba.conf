# Autenticação do Postgres de desenvolvimento. Primeira regra que casa vence.
# - superusuário (postgres) só pelo socket local (docker compose exec db ...);
#   pela rede é recusado, mesmo com TLS e senha certa
# - pela rede, só o banco do app, só os papéis do app, só a rede interna do
#   compose (samenet = sub-rede "data", onde só estão server/migrate/backup)
#   e sempre com TLS; o resto cai no reject final
# TYPE      DATABASE  USER                                         ADDRESS       METHOD
local       all       all                                                        scram-sha-256
host        all       postgres                                     all           reject
# healthcheck (pg_isready, no próprio container)
hostssl     minitown  minitown_app                                 127.0.0.1/32  scram-sha-256
hostssl     minitown  minitown_app,minitown_owner,minitown_backup  samenet       scram-sha-256
host        all       all                                          all           reject
